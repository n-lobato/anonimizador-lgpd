name: Testes e executável Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar em Releases a versão indicada em src/anonimizador/__init__.py (só no ramo main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Baixar dados do OCR (português)
        run: python build/baixar_tessdata.py

      - name: Testes (inclui PDF, OCR e interface)
        env:
          QT_QPA_PLATFORM: offscreen
          TESSDATA_PREFIX: ${{ github.workspace }}\build\tessdata
        run: |
          python -m pytest -v
          Write-Output "Código de saída do pytest: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Medição em PDF digitalizado (OCR)
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}\build\tessdata
        run: python build/avaliar_ocr.py --detalhes

      - name: Gerar executável
        run: pyinstaller --noconfirm anonimizador.spec

      - name: Testar o executável gerado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force amostra | Out-Null
          "Requerente: Pedro Henrique Alves, CPF 529.982.247-25." | Out-File -Encoding utf8 amostra\teste.txt
          .\dist\AnonimizadorLGPD\anonimizador-cli.exe amostra
          if ($LASTEXITCODE -ne 0) { throw "CLI falhou" }
          $saida = Get-Content amostra\anonimizados\teste_anonimizado.txt -Raw
          Write-Output $saida
          if ($saida -match "529.982") { throw "CPF não foi anonimizado" }

      - name: Compactar
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist\AnonimizadorLGPD\
          Compress-Archive -Path dist\AnonimizadorLGPD -DestinationPath AnonimizadorLGPD-windows.zip

      - name: Calcular SHA-256 do pacote
        shell: pwsh
        run: |
          $h = (Get-FileHash AnonimizadorLGPD-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  AnonimizadorLGPD-windows.zip" | Out-File -Encoding ascii -NoNewline AnonimizadorLGPD-windows.zip.sha256
          "SHA256=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "SHA-256: $h"

      - name: Medição de acertos no corpus
        run: python build/avaliar.py

      - uses: actions/upload-artifact@v4
        with:
          name: AnonimizadorLGPD-windows
          path: |
            AnonimizadorLGPD-windows.zip
            AnonimizadorLGPD-windows.zip.sha256

      - name: Ler a versão do programa
        shell: pwsh
        run: |
          $v = (Select-String -Path src/anonimizador/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "VERSAO=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "Versão: $v"

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSAO) }}
          name: ${{ format('Anonimizador LGPD {0}', env.VERSAO) }}
          target_commitish: ${{ github.sha }}
          files: |
            AnonimizadorLGPD-windows.zip
            AnonimizadorLGPD-windows.zip.sha256
          body: |
            **SHA-256 do pacote:** `${{ env.SHA256 }}`

            Para conferir no Windows: `Get-FileHash .\AnonimizadorLGPD-windows.zip -Algorithm SHA256`
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do sistema para o Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -r requirements-dev.txt
          python build/baixar_tessdata.py
          TESSDATA_PREFIX=$PWD/build/tessdata python -m pytest -v
